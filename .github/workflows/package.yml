# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Package

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref or SHA to package (defaults to the caller SHA)
        type: string
        required: false
        default: ""
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # No apt-get update: the ubuntu-latest image already ships cmake,
      # ninja and rpmbuild, and the Azure mirror hangs for minutes.
      - name: Workflow
        run: cmake --workflow --preset default

      - name: Upload DEB
        uses: actions/upload-artifact@v7
        with:
          name: kyocera-drivers-deb
          path: build/default/*.deb
          if-no-files-found: error

      - name: Upload RPM
        uses: actions/upload-artifact@v7
        with:
          name: kyocera-drivers-rpm
          path: build/default/*.rpm
          if-no-files-found: error

      - name: Upload TGZ
        uses: actions/upload-artifact@v7
        with:
          name: kyocera-drivers-tgz
          path: build/default/*.tar.gz
          if-no-files-found: error
